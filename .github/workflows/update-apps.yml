name: Update app catalog

on:
  push:
    paths:
      - repo.json
      - scripts/generate_apps.js
      - APPS.html
      - .github/workflows/update-apps.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate APPS.md
        run: node scripts/generate_apps.js

      - name: Commit catalog changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update generated app catalog"
          file_pattern: APPS.md

      - name: Configure GitHub Pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare Pages artifact
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          mkdir -p _site
          cp APPS.html repo.json _site/

      - name: Upload Pages artifact
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/deploy-pages@v4
